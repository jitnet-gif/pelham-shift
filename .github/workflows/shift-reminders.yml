name: 출근 알림 자동 점검

# 아무도 앱을 열지 않는 시간에도 '출근 1시간 전' 알림이 나가도록 서버를 깨웁니다.
# Vercel Hobby 플랜은 cron 이 하루 한 번뿐이라, 대신 여기서 돌립니다.
# 알림은 근무 시작 60분 전부터 나가므로, 10분 간격이면 그 창 안에 여러 번 들어갑니다.
# GitHub 스케줄러는 몇 분에서 20분쯤 늦을 수 있지만 창이 넓어 견딥니다.
# 이미 보낸 근무는 서버가 push_sent 에 표시해 두므로 두 번 가지 않습니다.

on:
  schedule:
    - cron: '*/10 * * * *'
  # 등록이 잘 됐는지 확인할 때 Actions 탭에서 손으로 한 번 돌려볼 수 있습니다.
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      # 주소에 tickKey 가 박혀 있어 비밀번호나 마찬가지입니다. 저장소 Secrets 에만 두고 로그에 찍지 않습니다.
      - name: 점검 주소 호출
        env:
          TICK_URL: ${{ secrets.PUSH_TICK_URL }}
        run: |
          if [ -z "$TICK_URL" ]; then
            echo "PUSH_TICK_URL 시크릿이 없습니다."
            echo "관리자 화면 > 직원 설정의 '출근 알림 자동 점검 주소'를 저장소 Secrets 에 등록하세요."
            exit 1
          fi
          status=$(curl -sS --max-time 30 -o response.json -w '%{http_code}' "$TICK_URL")
          echo "HTTP $status"
          cat response.json
          echo
          test "$status" = "200"
